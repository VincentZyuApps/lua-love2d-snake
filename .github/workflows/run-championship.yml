name: AI Championship

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      destination:
        description: Upload an artifact or publish a championship release
        type: choice
        options:
          - artifact
          - release
        default: artifact
      sizes:
        description: Comma-separated board sizes
        type: string
        default: 20x14,30x21,40x28
      edges:
        description: Comma-separated edge modes
        type: string
        default: walls,wrap
      algorithms:
        description: all or comma-separated algorithm IDs
        type: string
        default: all
      runs:
        description: Seeds per size, edge, and algorithm
        type: string
        default: "10"
      master_seed:
        description: Deterministic master seed
        type: string
        default: snake-championship-v1

permissions:
  contents: read

concurrency:
  group: championship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.trigger.outputs.should_run }}
      should_publish: ${{ steps.trigger.outputs.should_publish }}
      trigger_source: ${{ steps.trigger.outputs.trigger_source }}
      matrix: ${{ steps.config.outputs.matrix }}
      algorithms: ${{ steps.config.outputs.algorithms }}
      runs: ${{ steps.config.outputs.runs }}
      master_seed: ${{ steps.config.outputs.master_seed }}
      version: ${{ steps.metadata.outputs.version }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      recorded_at_utc: ${{ steps.metadata.outputs.recorded_at_utc }}
      recorded_at_local: ${{ steps.metadata.outputs.recorded_at_local }}
      file_stamp: ${{ steps.metadata.outputs.file_stamp }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      archive_name: ${{ steps.metadata.outputs.archive_name }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Match the championship trigger
        id: trigger
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_DESTINATION: ${{ inputs.destination || 'artifact' }}
        run: |
          set -euo pipefail
          SHOULD_RUN=false
          SHOULD_PUBLISH=false
          TRIGGER_SOURCE="event:${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_RUN=true
            case "$MANUAL_DESTINATION" in
              artifact) ;;
              release) SHOULD_PUBLISH=true ;;
              *) echo "Unsupported destination: $MANUAL_DESTINATION" >&2; exit 1 ;;
            esac
            TRIGGER_SOURCE="manual:$MANUAL_DESTINATION"
          elif python scripts/ci/ci-trigger.py --message "$COMMIT_MESSAGE" \
            --token release-championship; then
            SHOULD_RUN=true
            SHOULD_PUBLISH=true
            TRIGGER_SOURCE="commit:release-championship"
          elif python scripts/ci/ci-trigger.py --message "$COMMIT_MESSAGE" \
            --token run-championship; then
            SHOULD_RUN=true
            TRIGGER_SOURCE="commit:run-championship"
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER_SOURCE" >> "$GITHUB_OUTPUT"

      - name: Build release metadata
        id: metadata
        if: steps.trigger.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a SemVer value such as 0.6.0." >&2
            exit 1
          fi
          RECORDED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          FILE_STAMP="$(date -u +'%Y%m%dT%H%M%SZ')"
          RECORDED_AT_LOCAL="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M CST')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_TAG="championship-v${VERSION}-${FILE_STAMP}-${SHORT_SHA}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          ARCHIVE_NAME="lua-love2d-snake-championship-v${VERSION}-${FILE_STAMP}-${SHORT_SHA}.zip"
          ARTIFACT_NAME="lua-love2d-snake-championship-${FILE_STAMP}-${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "recorded_at_utc=$RECORDED_AT_UTC" >> "$GITHUB_OUTPUT"
          echo "recorded_at_local=$RECORDED_AT_LOCAL" >> "$GITHUB_OUTPUT"
          echo "file_stamp=$FILE_STAMP" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and validate the scenario matrix
        id: config
        if: steps.trigger.outputs.should_run == 'true'
        shell: bash
        env:
          SIZES: ${{ inputs.sizes || '20x14,30x21,40x28' }}
          EDGES: ${{ inputs.edges || 'walls,wrap' }}
          ALGORITHMS: ${{ inputs.algorithms || 'all' }}
          RUNS: ${{ inputs.runs || '10' }}
          MASTER_SEED: ${{ inputs.master_seed || 'snake-championship-v1' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lua5.1
          lua5.1 tests/test-runner.lua
          MATRIX="$(lua5.1 scripts/championship/championship-matrix.lua \
            --sizes "$SIZES" --edges "$EDGES" --algorithms "$ALGORITHMS" \
            --runs "$RUNS" --master-seed "$MASTER_SEED")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "algorithms=$ALGORITHMS" >> "$GITHUB_OUTPUT"
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
          echo "master_seed=$MASTER_SEED" >> "$GITHUB_OUTPUT"

  championship:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Run deterministic AUTO games
        env:
          ALGORITHMS: ${{ needs.prepare.outputs.algorithms }}
          RUNS: ${{ needs.prepare.outputs.runs }}
          MASTER_SEED: ${{ needs.prepare.outputs.master_seed }}
        run: >-
          lua5.1 scripts/championship/run-championship.lua
          --sizes "${{ matrix.size }}"
          --edges "${{ matrix.edge }}"
          --algorithms "$ALGORITHMS"
          --runs "$RUNS"
          --master-seed "$MASTER_SEED"
          --output-dir build/championship

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: championship-shard-${{ matrix.size }}-${{ matrix.edge }}
          path: build/championship/championship.json
          retention-days: 1
          if-no-files-found: error

  aggregate:
    needs: [prepare, championship]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: championship-shard-*
          path: build/shards

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Merge deterministic reports
        id: merge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          find build/shards -type f -name championship.json | LC_ALL=C sort > build/championship-manifest.txt
          lua5.1 scripts/championship/run-championship.lua \
            --merge-manifest build/championship-manifest.txt \
            --output-dir build/championship

      - name: Install chart dependencies
        if: steps.merge.outcome == 'success'
        run: >-
          python -m pip install --disable-pip-version-check
          matplotlib==3.10.6 pyparsing==3.2.5

      - name: Render charts, archive, and release body
        id: visuals
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            scripts/ci/test-ci-tools.py \
            scripts/championship/test-championship-cli.py
          python scripts/championship/championship-cli.py render \
            --input build/championship/championship.json \
            --archive "build/championship/${{ needs.prepare.outputs.archive_name }}"
          python scripts/ci/ci-render-release.py championship \
            --template .github/release-templates/championship-release.md \
            --output build/championship/release-body.md \
            --repository "$GITHUB_REPOSITORY" \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.release_tag }}" \
            --sha "$GITHUB_SHA" \
            --recorded-at-utc "${{ needs.prepare.outputs.recorded_at_utc }}" \
            --recorded-at-local "${{ needs.prepare.outputs.recorded_at_local }}" \
            --workflow-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --trigger "${{ needs.prepare.outputs.trigger_source }}" \
            --report build/championship/championship.json \
            --archive-name "${{ needs.prepare.outputs.archive_name }}"
          cd build/championship
          sha256sum \
            "${{ needs.prepare.outputs.archive_name }}" \
            championship-reliability.png \
            championship-efficiency.png \
            championship-scenarios.png \
            > SHA256SUMS.txt

      - name: Add report to the job summary
        if: always() && hashFiles('build/championship/championship.md') != ''
        run: >-
          sed '/CHAMPIONSHIP_VISUALS_START/,/CHAMPIONSHIP_VISUALS_END/d'
          build/championship/championship.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload championship reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: build/championship/*
          retention-days: 14
          if-no-files-found: error

      - name: Fail after preserving error reports
        if: >-
          steps.merge.outcome != 'success' ||
          steps.visuals.outcome != 'success' ||
          needs.championship.result != 'success'
        run: exit 1

  publish:
    needs: [prepare, aggregate]
    if: needs.prepare.outputs.should_publish == 'true' && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release-files

      - name: Create permanent championship release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.prepare.outputs.release_tag }}" \
            "release-files/${{ needs.prepare.outputs.archive_name }}" \
            release-files/championship-reliability.png \
            release-files/championship-efficiency.png \
            release-files/championship-scenarios.png \
            release-files/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "AI Championship ${{ needs.prepare.outputs.version }} · ${{ needs.prepare.outputs.recorded_at_local }} · ${{ needs.prepare.outputs.short_sha }}" \
            --notes-file release-files/release-body.md \
            --latest=false
